<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PR Diff Copy: Settings</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#1f2328; --muted:#59636e; --border:#d1d9e0; --accent:#238636; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#f0f6fc; --muted:#9198a1; --border:#3d444d; --accent:#2ea043; } }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
    main { max-width: 640px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 16px; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    textarea { box-sizing:border-box; width:100%; min-height:160px; padding:10px; resize:vertical;
      background:transparent; color:inherit; border:1px solid var(--border); border-radius:6px; font:inherit; }
    textarea:focus-visible { outline:2px solid var(--accent); outline-offset:-1px; }
    .row { display:flex; gap:8px; align-items:center; margin-top:12px; }
    button { font:inherit; font-weight:600; padding:6px 14px; border-radius:6px; cursor:pointer;
      border:1px solid var(--border); background:transparent; color:inherit; }
    button.primary { background:var(--accent); border-color:transparent; color:#fff; }
    #status { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Review prompt</h1>
    <p>Typed into Gemini, ChatGPT or Claude together with the attached diff. You still press send yourself.</p>
    <label for="prompt">Prompt</label>
    <textarea id="prompt" spellcheck="true"></textarea>
    <div class="row">
      <button id="save" class="primary" type="button">Save</button>
      <button id="reset" type="button">Reset to default</button>
      <span id="status" role="status"></span>
    </div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
